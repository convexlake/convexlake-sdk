[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "convexlake"
version = "0.2.0"
description = "Python SDK for the Convex Lake market data API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["polymarket", "kalshi", "deribit", "market-data", "prediction-markets", "options"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://convexlake.com"
Repository = "https://github.com/convexlake/convexlake-sdk"
Documentation = "https://github.com/convexlake/convexlake-sdk#readme"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
mcp = ["langchain-mcp-adapters>=0.1", "langchain-core>=0.3"]
dev = ["pytest", "responses", "langchain-core>=0.3", "langchain-mcp-adapters>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["convexlake*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
